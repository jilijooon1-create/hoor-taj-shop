<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هورتاج | اکسسوری لوکس موبایل</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <style>
        :root {
            --gold: #C8A96A;
            --dark: #060608;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; }

        body {
            background-color: var(--dark);
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }

        /* نور طلایی بسیار نرم در پس‌زمینه */
        .ambient-light {
            position: absolute;
            width: 60vw;
            height: 60vw;
            max-width: 500px;
            max-height: 500px;
            background: radial-gradient(circle, rgba(200, 169, 106, 0.15) 0%, transparent 60%);
            border-radius: 50%;
            animation: breathe 4s infinite alternate ease-in-out;
            z-index: 1;
        }

        @keyframes breathe {
            0% { transform: scale(0.9); opacity: 0.6; }
            100% { transform: scale(1.1); opacity: 1; }
        }

        /* ذرات طلایی */
        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: var(--gold);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--gold);
            animation: floatUp 6s infinite linear;
            z-index: 2;
        }

        @keyframes floatUp {
            0% { transform: translateY(50vh) scale(0); opacity: 0; }
            30% { opacity: 0.8; }
            70% { opacity: 0.8; }
            100% { transform: translateY(-50vh) scale(1); opacity: 0; }
        }

        /* کانتینر اصلی */
        .intro-container {
            position: relative;
            z-index: 10;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeOut 6s forwards;
        }

        /* عکس لوگو */
        .logo-img {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 50%;
            filter: drop-shadow(0 0 30px rgba(200, 169, 106, 0.6));
            animation: revealLogo 2.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            border: 2px solid rgba(200, 169, 106, 0.5);
            padding: 5px;
        }

        @keyframes revealLogo {
            0% { transform: scale(0.6) translateY(20px); opacity: 0; filter: blur(10px) drop-shadow(0 0 0px rgba(200,169,106,0)); }
            100% { transform: scale(1) translateY(0); opacity: 1; filter: blur(0) drop-shadow(0 0 30px rgba(200, 169, 106, 0.6)); }
        }

        /* متن‌ها - کاملا روشن و درخشان */
        .texts {
            margin-top: 30px;
            opacity: 0;
            animation: slideUp 1.5s forwards 1s;
        }

        .logo-text-fa {
            color: #F5D68A;
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 3px;
            text-shadow: 0 0 25px rgba(245, 214, 138, 0.6);
        }

        .logo-text-en {
            color: #ffffff;
            font-size: 13px;
            letter-spacing: 14px;
            margin-top: 8px;
            opacity: 1;
            font-weight: 600;
            padding-right: 14px;
        }

        .tagline {
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            margin-top: 25px;
            letter-spacing: 1px;
            font-weight: 300;
        }

        @keyframes slideUp {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeOut {
            0%, 85% { opacity: 1; }
            100% { opacity: 0; transform: scale(1.05); }
        }
    </style>
</head>
<body>

    <div class="ambient-light"></div>

    <div class="particle" style="left: 20%; animation-delay: 0s;"></div>
    <div class="particle" style="left: 40%; animation-delay: 1.5s;"></div>
    <div class="particle" style="left: 60%; animation-delay: 0.7s;"></div>
    <div class="particle" style="left: 80%; animation-delay: 2.5s;"></div>
    <div class="particle" style="left: 30%; animation-delay: 3.5s;"></div>
    <div class="particle" style="left: 70%; animation-delay: 4s;"></div>

    <div class="intro-container">
        <!-- لینک دائمی عکس خودت -->
        <img src="https://github.com/user-attachments/assets/22a9816e-e25e-4804-bed6-7ac62eda7e9f" alt="لوگوی هورتاج" class="logo-img">
        
        <div class="texts">
            <div class="logo-text-fa">هورتاج</div>
            <div class="logo-text-en">HOOR TAJ</div>
            <div class="tagline">تجربه‌ای لوکس از اکسسوری موبایل</div>
        </div>
    </div>

    <script>
        setTimeout(() => {
            document.body.innerHTML = '<h1 style="color:#F5D68A; font-family:sans-serif; text-align:center; margin-top:40vh; font-size:20px;">در حال انتقال به فروشگاه...</h1>';
        }, 5000);
    </script>
</body>
</html>
