<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هورتاج | اکسسوری لوکس موبایل</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <style>
        :root {
            --gold: #C8A96A;
            --dark: #060608; /* مشکی عمیق و مخملی */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; }

        body {
            background-color: var(--dark);
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }

        /* نور طلایی بسیار نرم در پس‌زمینه */
        .ambient-light {
            position: absolute;
            width: 60vw;
            height: 60vw;
            max-width: 500px;
            max-height: 500px;
            background: radial-gradient(circle, rgba(200, 169, 106, 0.15) 0%, transparent 60%);
            border-radius: 50%;
            animation: breathe 4s infinite alternate ease-in-out;
            z-index: 1;
        }

        @keyframes breathe {
            0% { transform: scale(0.9); opacity: 0.6; }
            100% { transform: scale(1.1); opacity: 1; }
        }

        /* ذرات طلایی بسیار ظریف و آهسته */
        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: var(--gold);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--gold);
            animation: floatUp 6s infinite linear;
            z-index: 2;
        }

        @keyframes floatUp {
            0% { transform: translateY(50vh) scale(0); opacity: 0; }
            30% { opacity: 0.8; }
            70% { opacity: 0.8; }
            100% { transform: translateY(-50vh) scale(1); opacity: 0; }
        }

        /* کانتینر اصلی */
        .intro-container {
            position: relative;
            z-index: 10;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeOut 5s forwards;
        }

        /* لوگوی خودت با یه افکت ظاهر شدن سینمایی */
        .logo-img {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 50%; /* برای اینکه دور عکس گرد بشه */
            filter: drop-shadow(0 0 25px rgba(200, 169, 106, 0.4));
            animation: revealLogo 2.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            border: 2px solid rgba(200, 169, 106, 0.3);
            padding: 5px;
        }

        @keyframes revealLogo {
            0% { transform: scale(0.6) translateY(20px); opacity: 0; filter: blur(10px) drop-shadow(0 0 0px rgba(200,169,106,0)); }
            100% { transform: scale(1) translateY(0); opacity: 1; filter: blur(0) drop-shadow(0 0 25px rgba(200, 169, 106, 0.4)); }
        }

        /* متن‌ها با ظرافت */
        .texts {
            margin-top: 25px;
            opacity: 0;
            animation: slideUp 1.5s forwards 1.2s;
        }

        .logo-text-fa {
            color: var(--gold);
            font-size: 38px;
            font-weight: 900;
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(200,169,106,0.3);
        }

        .logo-text-en {
            color: #fff;
            font-size: 11px;
            letter-spacing: 12px;
            margin-top: 8px;
            opacity: 0.6;
            padding-right: 12px; /* برای تعادل حروف انگلیسی */
        }

        .tagline {
            color: rgba(255,255,255,0.4);
            font-size: 12px;
            margin-top: 20px;
            letter-spacing: 2px;
            font-weight: 300;
        }

        @keyframes slideUp {
            0% { opacity: 0; transform: translateY(15px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* محو شدن نرم کل صفحه برای رفتن به سایت */
        @keyframes fadeOut {
            0%, 80% { opacity: 1; }
            100% { opacity: 0; transform: scale(1.05); }
        }
    </style>
</head>
<body>

    <div class="ambient-light"></div>

    <!-- ذرات طلایی -->
    <div class="particle" style="left: 20%; animation-delay: 0s;"></div>
    <div class="particle" style="left: 40%; animation-delay: 1.5s;"></div>

    <div class="particle" style="left: 30%; animation-delay: 3.5s;"></div>
