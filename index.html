<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هورتاج | ورود</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0B0B0F;
            color: #C8A96A;
            font-family: 'Vazirmatn', sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* انیمیشن‌های پس‌زمینه */
        .glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(200,169,106,0.3) 0%, transparent 70%);
            border-radius: 50%;
            animation: pulse 3s infinite alternate;
            z-index: 1;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #C8A96A;
            border-radius: 50%;
            opacity: 0;
            animation: floatUp 4s infinite;
            z-index: 2;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        @keyframes pulse {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.2); opacity: 1; }
        }

        /* لوگو و متن */
        .intro-container {
            text-align: center;
            z-index: 10;
            position: relative;
            animation: zoomFade 5s forwards;
        }

        .logo-circle {
            width: 150px;
            height: 150px;
            border: 2px solid #C8A96A;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: 0 0 20px rgba(200,169,106,0.2);
            animation: glowRotate 5s linear infinite;
        }

        .logo-circle::before {
            content: '👑';
            font-size: 40px;
            position: absolute;
            top: -25px;
        }

        .logo-text-fa {
            font-size: 32px;
            font-weight: 900;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .logo-text-en {
            font-size: 14px;
            letter-spacing: 8px;
            opacity: 0.8;
        }

        .tagline {
            font-size: 12px;
            margin-top: 15px;
            opacity: 0.6;
            letter-spacing: 1px;
        }

        @keyframes glowRotate {
            0% { box-shadow: 0 0 10px rgba(200,169,106,0.2); transform: rotate(0deg); }
            50% { box-shadow: 0 0 30px rgba(200,169,106,0.6); }
            100% { box-shadow: 0 0 10px rgba(200,169,106,0.2); transform: rotate(360deg); }
        }

        @keyframes zoomFade {
            0% { opacity: 0; transform: scale(0.5); filter: blur(10px); }
            20% { opacity: 1; transform: scale(1); filter: blur(0); }
            80% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(1.5); filter: blur(10px); }
        }

        /* صفحه اصلی سایت که بعد از 5 ثانیه میاد */
        .main-site {
            display: none;
            text-align: center;
            animation: fadeIn 1s forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 30px;
            border: 1px solid #C8A96A;
            color: #C8A96A;
            text-decoration: none;
            border-radius: 50px;
            font-family: 'Vazirmatn';
            transition: 0.3s;
        }
        .btn:hover {
            background: #C8A96A;
            color: #0B0B0F;
        }
    </style>
</head>
<body>

    <!-- ذرات طلایی شناور -->
    <div class="particle" style="left: 10%; animation-delay: 0s;"></div>
    <div class="particle" style="left: 30%; animation-delay: 1s;"></div>
    <div class="particle" style="left: 50%; animation-delay: 2s;"></div>
    <div class="particle" style="left: 70%; animation-delay: 0.5s;"></div>
    <div class="particle" style="left: 90%; animation-delay: 1.5s;"></div>

    <!-- انیمیشن ورود (۵ ثانیه) -->
    <div class="glow"></div>
    <div class="intro-container" id="intro">
        <div class="logo-circle">
            <span style="font-size: 24px;">تاج</span>
        </div>
        <div class="logo-text-fa">هورتاج</div>
        <div class="logo-text-en">HOOR TAJ</div>
        <div class="tagline">تجربه‌ای لوکس از اکسسوری موبایل</div>
    </div>

    <!-- صفحه اصلی سایت -->
    <div class="main-site" id="main">
        <h1 style="font-size: 24px;">به <span style="font-weight: 900;">هورتاج</span> خوش آمدید</h1>
        <p style="margin-top: 10px; opacity: 0.7;">فروشگاه لوازم جانبی لوکس</p>
        <a href="#" class="btn">مشاهده محصولات</a>
    </div>

    <script>
        // بعد از ۵ ثانیه، انیمیشن رو مخفی و سایت اصلی رو نشون بده
        setTimeout(() => {
            document.getElementById('intro').style.display = 'none';
            document.querySelector('.glow').style.display = 'none';
            document.getElementById('main').style.display = 'block';
        }, 5000);
    </script>
</body>
          </html>
