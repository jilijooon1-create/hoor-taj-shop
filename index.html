<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هورتاج | ورود</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <style>
        :root { --gold: #C8A96A; --dark: #050508; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; }
        body { background-color: var(--dark); overflow: hidden; height: 100vh; display: flex; justify-content: center; align-items: center; color: #fff; }

        /* پس‌زمینه تکنولوژی */
        .tech-bg {
            position: absolute; inset: 0;
            background-image: linear-gradient(rgba(200, 169, 106, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(200, 169, 106, 0.05) 1px, transparent 1px);
            background-size: 30px 30px; z-index: 1; animation: gridMove 10s linear infinite;
        }
        @keyframes gridMove { 0% { background-position: 0 0; } 100% { background-position: 0 30px; } }

        /* نور طلایی */
        .glow-light {
            position: absolute; width: 350px; height: 350px;
            background: radial-gradient(circle, rgba(200,169,106,0.25) 0%, transparent 60%);
            border-radius: 50%; z-index: 2; animation: pulse 3s infinite alternate;
        }
        @keyframes pulse { 0% { transform: scale(0.8); opacity: 0.5; } 100% { transform: scale(1.1); opacity: 1; } }

        /* ذرات نورانی */
        .particle { position: absolute; width: 3px; height: 3px; background: var(--gold); border-radius: 50%; box-shadow: 0 0 10px var(--gold); animation: floatUp 5s infinite linear; z-index: 3; }
        @keyframes floatUp { 0% { transform: translateY(100vh) scale(0); opacity: 0; } 20% { opacity: 1; } 80% { opacity: 1; } 100% { transform: translateY(-10vh) scale(1.5); opacity: 0; } }

        /* کانتینر لوگو */
        .intro-container { position: relative; z-index: 10; text-align: center; display: flex; flex-direction: column; align-items: center; animation: revealAll 5s forwards; }

        /* حلقه چرخان */
        .ring { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 220px; height: 220px; border: 2px dashed rgba(200, 169, 106, 0.4); border-radius: 50%; animation: rotateRing 8s linear infinite; }
        .ring::before { content: ''; position: absolute; top: -5px; left: 50%; width: 10px; height: 10px; background: var(--gold); border-radius: 50%; box-shadow: 0 0 15px var(--gold); }
        @keyframes rotateRing { 0% { transform: translate(-50%, -50%) rotate(0deg); } 100% { transform: translate(-50%, -50%) rotate(360deg); } }

        /* عکس لوگو موقت */
        .logo-img { width: 160px; height: 160px; object-fit: contain; border-radius: 50%; filter: drop-shadow(0 0 20px rgba(200, 169, 106, 0.5)); animation: zoomIn 2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; background: var(--dark); border: 2px solid var(--gold); padding: 5px; }
        @keyframes zoomIn { 0% { transform: scale(0.3); opacity: 0; filter: blur(10px); } 100% { transform: scale(1); opacity: 1; filter: blur(0); } }

        /* متن‌ها */
        .texts { margin-top: 30px; opacity: 0; animation: fadeInText 1s forwards 1.5s; }
        .logo-text-fa { color: var(--gold); font-size: 36px; font-weight: 900; letter-spacing: 2px; text-shadow: 0 0 15px rgba(200,169,106,0.4); }
        .logo-text-en { color: #fff; font-size: 12px; letter-spacing: 10px; margin-top: 10px; opacity: 0.8; }
        .tagline { color: rgba(255,255,255,0.5); font-size: 11px; margin-top: 15px; letter-spacing: 1px; }
        @keyframes fadeInText { to { opacity: 1; transform: translateY(0); } }

        /* محو شدن کل صفحه */
        @keyframes revealAll { 0%, 85% { opacity: 1; } 100% { opacity: 0; transform: scale(1.1); } }
    </style>
</head>
<body>

    <div class="tech-bg"></div>
    <div class="glow-light"></div>

    <div class="particle" style="left: 10%; animation-delay: 0s;"></div>
    <div class="particle" style="left: 25%; animation-delay: 2s;"></div>
    <div class="particle" style="left: 50%; animation-delay: 1s;"></div>
    <div class="particle" style="left: 75%; animation-delay: 3s;"></div>
    <div class="particle" style="left: 90%; animation-delay: 0.5s;"></div>

    <div class="intro-container">
        <div class="ring"></div>
        <!-- عکس موقت برای تست -->
        <img src="https://cdn-icons-png.flaticon.com/512/2662/2662503.png" alt="لوگوی هورتاج" class="logo-img">
        
        <div class="texts">
            <div class="logo-text-fa">هورتاج</div>
            <div class="logo-text-en">HOOR TAJ</div>
            <div class="tagline">تجربه‌ای لوکس از تکنولوژی</div>
        </div>
    </div>

    <script>
        setTimeout(() => {
            document.body.innerHTML = '<h1 style="color:#C8A96A; font-family:sans-serif; text-align:center; margin-top:40vh; font-size:20px;">در حال انتقال به فروشگاه...</h1>';
        }, 5000);
    </script>
</body>
</html>
